# Supabase project configuration
# https://supabase.com/docs/reference/cli/config
project_id = "qklmedcvjacblxngsikl"

# mp-webhook receives unauthenticated POST requests from MercadoPago.
# Signature authenticity is verified via HMAC-SHA256 inside the function
# itself (MP_SUBSCRIPTIONS_WEBHOOK_SECRET for ?flow=plan, MP_PLATFORM_WEBHOOK_SECRET
# for sena/tenant-deposit payments) — JWT verification is intentionally disabled.
[functions.mp-webhook]
verify_jwt = false

# create-sena-payment is called by anonymous clients from the external online
# booking site (no Supabase auth session available) — rate-limited by IP instead.
[functions.create-sena-payment]
verify_jwt = false

# whatsapp-webhook receives unauthenticated GET (verification) and POST (messages)
# requests from Meta. Verification uses WHATSAPP_VERIFY_TOKEN env var.
[functions.whatsapp-webhook]
verify_jwt = false

# whatsapp-reminders is called by a cron scheduler — no JWT available.
[functions.whatsapp-reminders]
verify_jwt = false

# mp-oauth-callback is hit directly by the browser as a MercadoPago redirect
# (no Supabase session on that request) — CSRF is instead handled internally
# via the state param, matched against tenant_mp_config.oauth_state.
[functions.mp-oauth-callback]
verify_jwt = false

# mp-token-refresh-cron is called by a Supabase Cron job (no JWT available) —
# same reasoning as whatsapp-reminders. Guarded internally by a shared secret
# (MP_CRON_SECRET, checked against the x-cron-secret header) since it makes
# MercadoPago API calls on every connected tenant's behalf.
[functions.mp-token-refresh-cron]
verify_jwt = false
